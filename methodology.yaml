# LexGrade methodology manifest
#
# Single source of truth for which version of each commons artifact is
# currently authoritative. The site build (sites/lexgrade.org) reads this file
# to resolve "current" versions.
#
# Bumping a version here is the only mechanical step required to roll the whole
# stack forward to a new edition of the standard.

schema_version: 1

# Version values are quoted strings so YAML floats like 3.0 round-trip cleanly
# as map keys (an unquoted 3.0 would normalize to "3" and miss its `artifacts` key).
current:
  standard: "1.1"
  technique_register: "1.0"

artifacts:
  standard:
    "1.0":
      path: commons/standard/LexGrade_Standard_v1.0.md
      license: CC-BY-SA-4.0
    "1.1":
      path: commons/standard/LexGrade_Standard_v1.1.md
      license: CC-BY-SA-4.0

  technique_register:
    "1.0":
      path: commons/standard/Technique_Register_v1.0.md
      license: CC-BY-SA-4.0

# Translations. English is the source and the text that governs; a translation
# is published under /<lang>/ on the site and never replaces an edition. Each
# entry names the edition it translates. The build refuses a translation that
# trails the current edition, so a new edition ships with its translations
# updated (see .github/CONTRIBUTING.md).
#   standard / technique_register — the full translated documents
#   criteria — an overlay of translated strings for lgs-criteria.yaml; numbers
#              and ids always come from the English catalog
translations:
  es:
    standard:
      translates: "1.1"
      path: commons/standard/translations/es/LexGrade_Standard_v1.1.es.md
      license: CC-BY-SA-4.0
    technique_register:
      translates: "1.0"
      path: commons/standard/translations/es/Technique_Register_v1.0.es.md
      license: CC-BY-SA-4.0
    criteria:
      translates: "1.1"
      path: commons/standard/translations/es/lgs-criteria.es.yaml
      license: CC-BY-SA-4.0
