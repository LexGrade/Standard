# This file is an OVERLAY, not a second catalog. It holds only the strings that
# are translated, keyed by the same ids as commons/standard/lgs-criteria.yaml.
# Every number (weights, deductions, thresholds, the grade scale) and every id
# comes from the English catalog at build time, so a translation cannot drift
# from the Standard's arithmetic. Titles, requirements, and sources mirror the
# tables in LexGrade_Standard_v1.1.ar.md; a test holds the ids complete.

language: ar
translates:
  standard: "1.1"
scope: "ممارسة تقديم الطلبات أمام المحكمة العليا لولاية نيويورك"
citations_verified: "فبراير 2026"
principles:
  P1:
    title: "السلامة الإجرائية"
    source: "§I استيفاء المتطلبات الأولية"
    note: "شرط مسبق يستوفيه مقدِّم الطلب بنفسه وفق قواعد المحكمة التي يودِع لديها. LGS لا يقيّمه. معرّفات بنود التقييم المصنَّفة تبدأ من LGS 2.1."
  P2:
    title: "تشخيص المشكلة"
    source: "§II-A تشخيص المشكلة"
  P3:
    title: "السند القانوني"
    source: "§II-B التحليل القانوني والسند"
  P4:
    title: "الأساس الوقائعي"
    source: "§III عرض الوقائع والدعم الإثباتي"
  P5:
    title: "الكتابة والتنظيم"
    source: "§IV الكتابة والتنظيم"
  P6:
    title: "الحنكة الاستراتيجية"
    source: "§V الحنكة الاستراتيجية"
  P7:
    title: "الأخلاقيات والمصارحة"
    source: "§VI الامتثال الأخلاقي"
    note: "بوابة نجاح أو رسوب بخصومات متدرجة. تُطرح الخصومات من الدرجة المركَّبة. أي استشهاد مهلوَس يفرض مستوى «ناقص» أيًّا كانت الدرجة المركَّبة."
  P8:
    title: "التقييم الذاتي"
    source: "§VII التقييم الذاتي والممارسة التأملية"
criteria:
  LGS 2.1:
    title: "توصيف المسألة"
    requirement: "يوصّف الطلب النزاع توصيفًا صحيحًا بأنه مسألة قانون أو وقائع أو مسألة مختلطة — ويشرح السبب."
    source: "§II-A، وصف تقدير A+"
  LGS 2.2:
    title: "اختيار الوسيلة"
    requirement: "الوسيلة الإجرائية المختارة هي التي تحقق الانتصاف المطلوب بملف الدعوى المتاح؛ ويذكر الطلب عناصر الوسيلة ويبيّن أن الوقائع تستوفي كل عنصر."
    source: "§II-A، وصف تقدير A+"
  LGS 2.3:
    title: "تحليل الوسائل البديلة"
    requirement: "يشرح الطلب لماذا نُظر في وسائل إجرائية بديلة ثم استُبعدت."
    source: "§II-A، وصف تقدير A+"
  LGS 2.4:
    title: "الربط بين التشخيص والاستراتيجية"
    requirement: "يبيّن الطلب كيف يقود توصيف المشكلة الاختيارات التحليلية والاستراتيجية اللاحقة."
    source: "§II-A، وصف تقدير A+"
  LGS 3.1:
    title: "نص التشريع"
    requirement: "لكل حجة قانونية، يُستشهد بالتشريع الحاكم مع اقتباس عبارته النافذة."
    source: "§II-B، تسلسل الأسانيد (a)"
  LGS 3.2:
    title: "السند الملزِم"
    requirement: "يُستشهد بحكم ملزِم واحد على الأقل في وقائع مشابهة لكل حجة."
    source: "§II-B، تسلسل الأسانيد (b)"
  LGS 3.3:
    title: "السند الاسترشادي"
    requirement: "السند الاسترشادي (الدوائر الأخرى، المحاكم الفيدرالية، المؤلفات الفقهية) يكمّل السند الملزِم حيث يناسب."
    source: "§II-B، تسلسل الأسانيد (c)"
  LGS 3.4:
    title: "المصادر الإدارية ومصادر الممارسة"
    requirement: "تُحدَّد الأوامر الإدارية أو Uniform Rules أو نماذج OCA أو أدلة الممارسة المنطبقة."
    source: "§II-B، تسلسل الأسانيد (d)"
  LGS 3.5:
    title: "السند المعاكس"
    requirement: "يُفصَح عن أقوى سند مخالف ويُميَّز على وجه التحديد."
    source: "§II-B، تسلسل الأسانيد (e)؛ NY RPC 3.3(a)(2)"
  LGS 3.6:
    title: "عبء الإثبات"
    requirement: "يُحدَّد عبء الإثبات تحديدًا صحيحًا، بما في ذلك أي طرف يتحمله في كل مرحلة."
    source: "§II-B، بنود التقييم المحددة"
  LGS 3.7:
    title: "منهجية تفسير التشريع"
    requirement: "ينطلق التفسير من النص ← التاريخ التشريعي ← الغاية التشريعية، لا من تأكيد مجرد."
    source: "§II-B، بنود التقييم المحددة؛ Gluck"
  LGS 3.8:
    title: "الاستدلال بالقياس"
    requirement: "يُستخدم الاستدلال بالقياس بوصفه مهارة إيجابية، مستقلة عن تمييز القضايا المعاكسة."
    source: "§II-B، بنود التقييم المحددة؛ Sherwin"
  LGS 3.9:
    title: "الغاية التشريعية"
    requirement: "يتناول الطلب الغاية التي وُضع لها التشريع الحاكم، لا نصه فقط."
    source: "§II-B، بنود التقييم المحددة؛ Gluck"
  LGS 3.10:
    title: "توليف السوابق"
    requirement: "حيث تُستمد القاعدة الحاكمة من أكثر من سند، يذكر الطلب القاعدة التي ترسيها تلك الأسانيد مجتمعة، ويبيّن ما يضيفه كل منها إليها، ويطبّق القاعدة المولَّفة؛ أما سلسلة من أوصاف القضايا أو الشروح بين قوسين دون قاعدة مذكورة فليست توليفًا."
    source: "v1.1؛ Clark & DeSanctis"
  LGS 4.1:
    title: "المعرفة الشخصية"
    requirement: "تستند الإفادات إلى المعرفة الشخصية (وهو المعيار الذي يضعه CPLR لإفادات المحامين وللإفادات الخطية المشفوعة بيمين من الأطراف)."
    source: "§III، بنود التقييم المحددة"
  LGS 4.2:
    title: "الأساس الإثباتي"
    requirement: "حيث يُعتمد على سجلات الأعمال أو أدلة مستندية أخرى، يُرسى الأساس الذي تتطلبه قواعد الإثبات."
    source: "§III، بنود التقييم المحددة"
  LGS 4.3:
    title: "الإحالة الدقيقة إلى المرفقات"
    requirement: "كل تأكيد جوهري مربوط بمرفق محدد، يُعرَّف بحرف المرفق أو رقمه وبالصفحة أو الفقرة."
    source: "§III، بنود التقييم المحددة"
  LGS 4.4:
    title: "اكتمال قائمة المرفقات"
    requirement: "كل مرفق مشار إليه في الإفادة يظهر في قائمة المرفقات، وكل عنصر في القائمة مشار إليه في الإفادة."
    source: "§III، بنود التقييم المحددة"
  LGS 4.5:
    title: "الأمانة الإثباتية"
    requirement: "يقرّ الطلب بما يُظهره ملف الدعوى وما لا يُظهره، دون التنازل عن الموقف القانوني."
    source: "§III، وصف تقدير A+؛ Sherwin"
  LGS 5.1:
    title: "عناوين نقاط حِجاجية"
    requirement: "عناوين النقاط حِجاجية وذات مضمون، لا وصفية."
    source: "§IV، بنود التقييم المحددة؛ Commercial Division Rule 17"
  LGS 5.2:
    title: "النبرة"
    requirement: "قوية بالدليل لا بالبلاغة؛ محترمة تجاه المحكمة ومحامي الخصم."
    source: "§IV، بنود التقييم المحددة"
  LGS 5.3:
    title: "الاقتصاد"
    requirement: "كل فقرة تدفع الحجة إلى الأمام؛ ويُحذف السرد غير اللازم."
    source: "§IV، بنود التقييم المحددة"
  LGS 5.4:
    title: "بنية الاستشهاد"
    requirement: "يُعرض السند بترتيب: التشريع قبل السوابق القضائية، والملزِم قبل الاسترشادي، والتطبيق قبل الرد."
    source: "§IV، بنود التقييم المحددة"
  LGS 5.5:
    title: "المعايرة على الجمهور"
    requirement: "الطلب معايَر على الممارسة المحلية للمحكمة، والمعايير المنطبقة، والوضع الإجرائي."
    source: "§IV، بنود التقييم المحددة؛ Wizner"
  LGS 5.6:
    title: "البنية التحليلية"
    requirement: "لكل حجة بنية تحليلية ظاهرة: النتيجة أو القاعدة تُذكر أولًا، ثم تُشرح القاعدة من سندها، ثم تُطبَّق على وقائع ملف الدعوى، ثم تُعاد النتيجة (عائلة CREAC / IRAC)؛ يستطيع القارئ أن يحدد موضع كل خطوة، ولا تغيب خطوة ولا تُدمج في أخرى."
    source: "v1.1؛ Clark & DeSanctis"
  LGS 6.1:
    title: "جودة الأمر المقترح"
    requirement: "يعدّد الأمر المقترح الأوراق المؤيدة (وفق CPLR 2219)؛ كل فقرة ORDERED تقابل بند انتصاف واحدًا؛ يتضمن حكمًا بالتبليغ وموعدًا نهائيًا للامتثال؛ وهو جاهز للتوقيع دون تعديل."
    source: "§V، بنود التقييم المحددة؛ Clermont"
  LGS 6.2:
    title: "الوضع الاستئنافي"
    requirement: "ينشئ الطلب ملفًا استئنافيًا نظيفًا، ويحفظ الحجج، ويتجنب التنازلات غير اللازمة."
    source: "§V، بنود التقييم المحددة؛ Clermont"
  LGS 6.3:
    title: "استراتيجية الطلبات المتعددة"
    requirement: "حيث يكون الطلب جزءًا من سلسلة، يظهر التوقيت والترتيب والتفاعل مع الطلبات الأخرى المعلّقة."
    source: "§V، بنود التقييم المحددة"
  LGS 6.4:
    title: "الإلمام بالتخصصات الأخرى"
    requirement: "تظهر المعرفة غير القانونية ذات الصلة (التحليل المالي، السجلات الطبية، التقنية) حيثما ينطبق."
    source: "§V، بنود التقييم المحددة؛ Rakoff"
  LGS 6.5:
    title: "المعايرة على الوصول إلى العدالة"
    requirement: "ينظر الطلب في الأثر على الأطراف غير الممثَّلين بمحامٍ أو قليلي الموارد حيثما كان ذا صلة."
    source: "§V، بنود التقييم المحددة؛ Wizner"
  LGS 7.1:
    title: "لا استشهادات مختلَقة"
    requirement: "لا يشير أي استشهاد إلى قضية غير موجودة."
    source: "NY RPC 3.3؛ 22 NYCRR 130-1.1؛ Mata v. Avianca"
    deduction_note: "−20 لكل حالة؛ ويفرض أيضًا مستوى المطابقة «ناقص»"
  LGS 7.2:
    title: "لا أحكام مختلَقة"
    requirement: "لا يُحرَّف اقتباس ما قضت به أي قضية ولا يُختلق."
    source: "NY RPC 3.3(a)(1)"
  LGS 7.3:
    title: "الإفصاح عن السند المعاكس"
    requirement: "يُفصَح عن كل سند حاكم معاكس مباشرةً."
    source: "NY RPC 3.3(a)(2)"
  LGS 7.4:
    title: "لا بيانات وقائعية كاذبة"
    requirement: "لا يوجد بيان وقائعي جوهري كاذب."
    source: "NY RPC 3.3(a)(1)؛ 22 NYCRR 130-1.1"
  LGS 7.5:
    title: "الوسيلة الإجرائية الصحيحة"
    requirement: "الوسيلة المختارة تطابق الانتصاف المطلوب."
    source: "Rakoff؛ CPLR 3211 مقابل 3212"
  LGS 7.6:
    title: "الاستشهاد بالسند الحاكم"
    requirement: "يستشهد الطلب بالسند الحاكم لكل حجة قانونية."
    source: "ABA Standards؛ NY RPC 1.1"
  LGS 7.7:
    title: "لا هجوم شخصي"
    requirement: "لا هجوم شخصي على محامي الخصم أو على أي طرف."
    source: "22 NYCRR 130-1.1(c)"
  LGS 7.8:
    title: "لا حكم درجة أولى بوصفه ملزِمًا"
    requirement: "لا يُستشهد بأي حكم من محكمة درجة أولى بوصفه سندًا ملزِمًا."
    source: "التسلسل الهرمي لمحاكم نيويورك"
  LGS 7.9:
    title: "استخدام منهجية التفسير"
    requirement: "الحجج التشريعية تستخدم منهجية تفسير، لا تأكيدًا مجردًا."
    source: "Gluck"
  LGS 7.10:
    title: "الامتثال الإجرائي لحدود الطول"
    requirement: "يلتزم الإيداع بحدود الطول التي تفرضها قواعد المحكمة التي يُودَع لديها."
    source: "22 NYCRR 202.8-b (الامتثال تحدده المحكمة)"
  LGS 7.11:
    title: "إيداع الإقرار"
    requirement: "يُودَع أي إقرار بالاستشهادات تتطلبه قواعد المحكمة."
    source: "22 NYCRR 130-1.1-a (المتطلب تحدده المحكمة)"
  LGS 7.12:
    title: "شرح سلاسل الاستشهادات"
    requirement: "كل سلسلة استشهادات تتضمن شرحًا بين قوسين يبيّن صلة كل قضية."
    source: "Clermont؛ المعايير المهنية"
  LGS 8.1:
    title: "أقوى سبب للرفض"
    requirement: "يحدد الطلب أقوى سبب واحد قد ترفضه المحكمة بناءً عليه ويتناول ذلك السبب."
    source: "§VII، السؤال 1"
  LGS 8.2:
    title: "استباق الحجة المضادة"
    requirement: "يحدد الطلب أفضل حجة مضادة لدى محامي الخصم ويبيّن أين استُبقت."
    source: "§VII، السؤال 2"
  LGS 8.3:
    title: "حسن التقدير في الإيداع"
    requirement: "يبيّن الطلب لماذا كان إيداعه مناسبًا وما البدائل التي نُظر فيها ثم استُبعدت."
    source: "§VII، السؤال 3؛ Kronman"
  LGS 8.4:
    title: "الأثر على الأطراف الضعيفة"
    requirement: "ينظر الطلب في الأثر على الأطراف غير الممثَّلين بمحامٍ أو قليلي الموارد."
    source: "§VII، السؤال 4؛ Wizner"
  LGS 8.5:
    title: "الصمود في الاستئناف"
    requirement: "يحدد الطلب أي الحجج محفوظة للاستئناف وما الذي جرى التنازل عنه، إن وُجد."
    source: "§VII، السؤال 5؛ Clermont"
conformance_levels:
  expert:
    label: "خبير"
    gate: "اجتياز بوابة المصارحة في المبدأ 7 (بلا خصومات تلقائية) وعدم وجود أي استشهاد مهلوَس"
    precondition: "تأكّد مقدِّم الطلب بنفسه من الامتثال الإجرائي وفق المبدأ 1"
    composite_band: "90 أو أكثر (سلّم التقديرات: A− أو A أو A+)"
    descriptor: "أعلى مستوى: صياغة شاملة ومنضبطة"
    note: "استخدام فئات السند الخمس كلها؛ تمييز السند المعاكس؛ أمر مقترح جاهز للتوقيع؛ تقييم ذاتي يحدّد نقاط ضعف حقيقية؛ لا استشهادات مهلوَسة."
  competent:
    label: "كفء"
    gate: "اجتياز بوابة المصارحة في المبدأ 7 وعدم وجود أي استشهاد مهلوَس"
    precondition: "تأكّد مقدِّم الطلب بنفسه من الامتثال الإجرائي وفق المبدأ 1"
    composite_band: "من 80 إلى 89 شاملةً الطرفين (سلّم التقديرات: B− أو B أو B+)"
    descriptor: "الحدّ الأدنى العملي للعمل المهني"
    note: "معيار قانوني ووسيلة إجرائية صحيحان؛ ثلاث فئات سند على الأقل؛ ثغرات في السند المعاكس أو في الأمر المقترح؛ تقييم ذاتي محدود."
  deficient:
    label: "ناقص"
    conditions:
      - "عدم اجتياز بوابة المصارحة في المبدأ 7، أو"
      - "الدرجة المركَّبة 79 أو أقل (سلّم التقديرات: C+ وما دونه)، أو"
      - "وجود أي استشهاد مهلوَس (مهما كانت الدرجة المركَّبة)"
    descriptor: "خطر يتعلق بالمسؤولية المهنية"
    note: "وسيلة إجرائية خاطئة، أو فئات سند ناقصة، أو لا سند معاكس، أو أمر مقترح بصيغة جاهزة عامة، أو لا تقييم ذاتي، أو استشهادات مهلوَسة."
conformance_claim:
  required_elements:
    - "المستوى المعلَن (خبير أو كفء أو ناقص)"
    - "الإصدار (LexGrade Standard v1.1): الإعلانات خاصة بإصدار بعينه؛ الإصدارات الفرعية تُقارن مستوياتها، لكن الإعلان يسمّي الطبعة التي جرى التقييم وفقها بالضبط"
    - "الدرجة المركَّبة وتاريخ التقييم"
    - "ملف الاختصاص القضائي (معايرة نيويورك الأساسية، أو ملف مسمّى)"
    - "المقيِّم (تقييم ذاتي، أو المقيِّم البشري المسمّى أو المقيِّمون، أو النموذج والإعدادات)"
  asserts: "أن الدرجة المركَّبة للطلب، في الإصدار المذكور وفي التاريخ المذكور، وقعت ضمن نطاق المستوى المعلَن، وأن شرطَي البوابة والشرط المسبق لذلك المستوى تحققا."
  does_not_assert: "أن المذكرة سليمة إجرائيًا (مسؤولية مقدِّم الطلب وفق المبدأ 1)، ولا أن كل استشهاد جرى التحقق منه (فعل صاحب الإعلان لا ضمان من المعيار)، ولا أن الطلب سيُقبل."
automatic_demotion_rules:
  - condition: "أي استشهاد مهلوَس"
    result: "ناقص (مهما كانت الدرجة المركَّبة)"
  - condition: "وسيلة إجرائية خاطئة"
    result: "لا يتجاوز كفء"
  - condition: "غياب المذكرة القانونية (Memorandum of Law)"
    result: "لا يتجاوز كفء"
  - condition: "عدم تناول أي سند معاكس"
    result: "لا يتجاوز كفء"
composite:
  order_of_operations:
    - "قدِّر كل مبدأ يُمنح درجة من 0 إلى 100 بنطاقات الدرجات الخاصة بكل مبدأ في §4."
    - "النقاط المرجَّحة: مجموع (التقدير/100 × الوزن) على P2 وP3 وP4 وP5 وP6 وP8 → /80."
    - "التحويل: المجموع الفرعي / 0.80 → أساس من 100 نقطة."
    - "طبِّق المعدِّل الصافي وخصومات P7 على أساس 100 نقطة."
    - "الحدّ الأدنى 0، والسقف 98."
  negative_modifiers:
    - label: "ادّعاء مجرَّد بشأن التشريع (بلا سوابق قضائية)"
      note: "−1 لكل مرة"
    - label: "تناول ضعيف للسند المعاكس (لا يبلغ مخالفة LGS 7.3)"
  conformance_names:
    expert: "خبير"
    competent: "كفء"
    deficient: "ناقص"
  grade_scale:
