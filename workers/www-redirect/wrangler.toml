# Redirects www.lexgrade.org to lexgrade.org. Separate from the site's Worker,
# which only serves static assets and can't redirect by hostname.
#
# Not part of Workers Builds. Deploy changes by hand from this directory:
#   npx wrangler deploy

name = "lexgrade-www-redirect"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "www.lexgrade.org", custom_domain = true }]
